D(117,"متوترکسات","Methotrexate","انکولوژی","آنتی‌متابولیت‌ها","مهار دی‌هیدروفولات ردوکتاز و مسیرهای وابسته به فولات.","برخی سرطان‌ها و بیماری‌های التهابی یا خودایمنی منتخب.","سرکوب مغز استخوان، آسیب کبدی، موکوزیت و سمیت ریوی.","بارداری، برخی بیماری‌های کبدی و اختلالات خونی.","CBC، عملکرد کبد و کلیه.","NSAIDها و برخی آنتی‌بیوتیک‌ها.","در برخی بیماری‌های غیرسرطانی معمولاً برنامه مصرف هفتگی دارد؛ خطای روزانه خطرناک است."),
D(118,"تاموکسیفن","Tamoxifen","انکولوژی","درمان‌های هورمونی سرطان","تعدیل‌کننده انتخابی گیرنده استروژن.","برخی سرطان‌های پستان گیرنده هورمونی مثبت.","گرگرفتگی، ترومبوآمبولی و خطر سرطان آندومتر.","سابقه برخی رویدادهای ترومبوتیک در کاربردهای پیشگیری نیازمند بررسی.","علائم ترومبوز و ارزیابی زنان.","مهارکننده‌های قوی CYP2D6 می‌توانند فعال‌سازی را کاهش دهند.","در بافت پستان اثر ضد استروژنی دارد."),
D(119,"ایماتینیب","Imatinib","انکولوژی","مهارکننده‌های تیروزین کیناز","مهار تیروزین کینازهای خاص مانند BCR-ABL.","برخی بدخیمی‌های خونی و تومورهای استرومال گوارشی.","ادم، تهوع، راش و سرکوب مغز استخوان.","حساسیت و برخی شرایط نیازمند تنظیم تخصصی.","CBC، عملکرد کبد و پاسخ مولکولی یا توموری.","القاکننده‌ها و مهارکننده‌های CYP3A4.","درمان هدفمند مولکولی است."),
D(120,"نالوکسون","Naloxone","بیهوشی و مراقبت ویژه","آنتاگونیست‌های اپیوئیدی","مهار رقابتی گیرنده‌های اپیوئیدی.","برگشت سرکوب تنفسی ناشی از اپیوئیدها.","علائم ترک حاد، بی‌قراری و تهوع.","حساسیت دارویی؛ خطر ترک ناگهانی در افراد وابسته.","تنفس، هوشیاری و بازگشت علائم.","اثر اپیوئیدها ممکن است از نالوکسون طولانی‌تر باشد.","آنتاگونیست است و اثر اپیوئید را برمی‌گرداند.")
];

const icons={
"قلب و عروق":"❤️","کلیه و ادرارآورها":"🧪","ضد میکروب‌ها":"🦠",
"غدد و دیابت":"🧬","خون و انعقاد":"🩸","سیستم عصبی و روان":"🧠",
"گوارش":"🫃","تنفسی":"🫁","درد و التهاب":"💊",
"بیهوشی و مراقبت ویژه":"🏥","پوست و آلرژی":"🩺",
"اورولوژی":"🧫","زنان و زایمان":"🌸","انکولوژی":"🔬"
};
let page="home", selectedGroup="",selectedSub="",selectedDrug=null;
const content=document.getElementById("content");
const groups=[...new Set(drugs.map(d=>d.group))];
const subs=[...new Set(drugs.map(d=>d.sub))];
document.getElementById("drugCount").textContent=drugs.length;
document.getElementById("groupCount").textContent=groups.length;
document.getElementById("subCount").textContent=subs.length;

function card(title,desc,icon,click){
return `<div class="item" onclick="${click}"><div class="emoji">${icon}</div><h3>${title}</h3><p>${desc}</p></div>`;
}
function home(){
page="home";selectedGroup="";selectedSub="";selectedDrug=null;
document.getElementById("search").value="";
content.innerHTML=`<h2 class="section-title">گروه‌های اصلی دارویی</h2><div class="grid">${
groups.map(g=>card(g,drugs.filter(d=>d.group===g).length+" دارو در این گروه",icons[g]||"💊",`openGroup('${g}')`)).join("")
}</div>`;
}
function openGroup(g){
page="group";selectedGroup=g;
const s=[...new Set(drugs.filter(d=>d.group===g).map(d=>d.sub))];
content.innerHTML=`<div class="topbar"><button class="back" onclick="home()">← بازگشت</button><div class="path">${g}</div></div><h2 class="section-title">زیرگروه‌های ${g}</h2><div class="grid">${
s.map(x=>card(x,drugs.filter(d=>d.group===g&&d.sub===x).length+" دارو","📂",`openSub('${x}')`)).join("")
}</div>`;
}
function openSub(s){
page="sub";selectedSub=s;
const arr=drugs.filter(d=>d.group===selectedGroup&&d.sub===s);
content.innerHTML=`<div class="topbar"><button class="back" onclick="openGroup('${selectedGroup}')">← بازگشت</button><div class="path">${selectedGroup} / ${s}</div></div><h2 class="section-title">${s}</h2>${
arr.map(d=>`<div class="drug" onclick="openDrug(${d.id})"><h3>${d.fa}</h3><p>${d.en}</p></div>`).join("")
}`;
}
function openDrug(id){
page="detail";selectedDrug=drugs.find(d=>d.id===id);
const d=selectedDrug;
const sections=[
["مکانیسم اثر",d.mechanism],
["موارد مصرف",d.uses],
["عوارض جانبی",d.adverse],
["موارد منع مصرف و احتیاط",d.contra],
["پایش و نکات بالینی",d.monitor],
["تداخلات دارویی",d.interactions],
["مقایسه با داروهای مشابه",d.compare]
];
content.innerHTML=`<div class="topbar"><button class="back" onclick="openSub('${d.sub}')">← بازگشت به داروها</button></div>
<div class="detail"><h2>${d.fa}</h2><div class="english">${d.en}</div><span class="tag">${d.group} / ${d.sub}</span>
${sections.map(s=>`<div class="info"><h4>${s[0]}</h4><p>${s[1]}</p></div>`).join("")}
</div><p class="small">این صفحه آموزشی است. کاربرد و محدودیت هر دارو باید با بروشور رسمی، منابع معتبر و راهنمای بالینی به‌روز بررسی شود.</p>`;
}
function searchDrugs(){
const q=document.getElementById("search").value.trim().toLowerCase();
if(!q){home();return}
page="search";
const found=drugs.filter(d=>[d.fa,d.en,d.group,d.sub].some(v=>v.toLowerCase().includes(q)));
content.innerHTML=`<h2 class="section-title">نتایج جست‌وجو: ${found.length}</h2>${
found.map(d=>`<div class="drug" onclick="openDrug(${d.id})"><h3>${d.fa}</h3><p>${d.en} · ${d.group} · ${d.sub}</p></div>`).join("")
||"<p>موردی پیدا نشد.</p>"}`;
}
home();
</script>
</body>
</html>
